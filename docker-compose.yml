services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docmind
      POSTGRES_PASSWORD: docmind
      POSTGRES_DB: docmind
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmind"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      # Remove this line (and the `db` service) when using Supabase; put its URI in .env
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://docmind:docmind@db:5432/docmind}
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]

  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  pgdata:
