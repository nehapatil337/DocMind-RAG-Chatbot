name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: docmind, POSTGRES_PASSWORD: docmind, POSTGRES_DB: docmind }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docmind" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - working-directory: backend
        run: uv sync
      - working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://docmind:docmind@localhost:5432/docmind
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - working-directory: frontend
        run: npm ci && npm run build
